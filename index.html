<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>


  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
    window.TrackJS && TrackJS.install({ 
      token: "8457fbdfc55c4ad8951457d987b3316e"
    });
  </script>



  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    let form = document.querySelector('form');

    class CalculatorError extends Error {
      constructor(message) {
        super(message);
        this.name = "CalculatorError";
      }
    }
    window.onerror = function (message, source, lineno, colno, error) {
      console.log("Global error caught!");
      console.log("Message:", message);
      console.log("Line:", lineno, "Column:", colno);
      return true;
    };
    form.addEventListener('submit', e => {
      e.preventDefault();

      try {
        let output = document.querySelector('output');
        let firstNum = document.querySelector('#first-num').value;
        let secondNum = document.querySelector('#second-num').value;
        let operator = document.querySelector('#operator').value;

        if (firstNum === "" || secondNum === "") {
          throw new CalculatorError("Both input fields must contain a number.");
        }

        if (isNaN(firstNum) || isNaN(secondNum)) {
          throw new CalculatorError("Inputs must be valid numbers.");
        }

        if (operator === "/" && Number(secondNum) === 0) {
          throw new CalculatorError("Cannot divide by zero.");
        }

        output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
      }
      catch (error) {
        if (error instanceof CalculatorError) {
          console.error(`${error.name}: ${error.message}`);
        } else {
          console.error("Unexpected Error:", error.message);
        }

        document.querySelector('output').innerHTML =
          "Error: " + error.message;
      }
      finally {
        console.log("Calculation attempt completed.");
      }
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish
    errorBtns[0].addEventListener("click", (e) => {
      e.preventDefault();
      console.log("Console Log Demo");
    });

    errorBtns[1].addEventListener("click", (e) => {
      e.preventDefault();
      console.error("Console Error Demo");
    });

    errorBtns[2].addEventListener("click", (e) => {
      e.preventDefault();
      console.count("Button Click");
    });

    errorBtns[3].addEventListener("click", (e) => {
      e.preventDefault();
      console.warn("Console Warn Demo");
    });

    errorBtns[4].addEventListener("click", (e) => {
      e.preventDefault();
      console.assert(2 + 2 === 5, "Assertion Failed");
    });

    errorBtns[5].addEventListener("click", (e) => {
      e.preventDefault();
      console.clear();
    });

    errorBtns[6].addEventListener("click", (e) => {
      e.preventDefault();
      console.dir(document.querySelector("form"));
    });

    errorBtns[7].addEventListener("click", (e) => {
      e.preventDefault();
      console.dirxml(document.querySelector("form"));
    });

    errorBtns[8].addEventListener("click", (e) => {
      e.preventDefault();

      console.group("Calculator Data");
      console.log("First Number:", document.querySelector("#first-num").value);
      console.log("Second Number:", document.querySelector("#second-num").value);
      console.log("Operator:", document.querySelector("#operator").value);
    });

    errorBtns[9].addEventListener("click", (e) => {
      e.preventDefault();
      console.groupEnd();
    });

    errorBtns[10].addEventListener("click", (e) => {
      e.preventDefault();

      console.table([
        {
          firstNum: document.querySelector("#first-num").value,
          secondNum: document.querySelector("#second-num").value,
          operator: document.querySelector("#operator").value
        }
      ]);
    });

    errorBtns[11].addEventListener("click", (e) => {
      e.preventDefault();
      console.time("timer");
    });

    errorBtns[12].addEventListener("click", (e) => {
      e.preventDefault();
      console.timeEnd("timer");
    });

    errorBtns[13].addEventListener("click", (e) => {
      e.preventDefault();

      function traceExample() {
        console.trace();
      }

      traceExample();
    });
    errorBtns[14].addEventListener("click", (e) => {
      e.preventDefault();

      nonExistentFunction();
    });
  </script>
</body>

</html>
